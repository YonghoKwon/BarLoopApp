name: BarLoop
options:
  bundleIdPrefix: com.yonghokwon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BarLoopCore:
    path: Packages/BarLoopCore
targets:
  BarLoop:
    type: application
    platform: iOS
    sources:
      - path: BarLoopApp
    resources:
      - path: BarLoopApp/Resources
    dependencies:
      - package: BarLoopCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yonghokwon.BarLoop
        PRODUCT_NAME: BarLoop
        INFOPLIST_KEY_CFBundleDisplayName: BarLoop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: BarLoopApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations:
          - ko
          - en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        NSBluetoothAlwaysUsageDescription: $(PRODUCT_NAME) uses Bluetooth MIDI devices to control practice playback.
        NSLocalNetworkUsageDescription: $(PRODUCT_NAME) can discover network MIDI sessions you choose to use.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: BarLoopApp/BarLoop.entitlements
      properties: {}
  BarLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BarLoopTests
    dependencies:
      - target: BarLoop
      - package: BarLoopCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yonghokwon.BarLoopTests
schemes:
  BarLoop:
    build:
      targets:
        BarLoop: all
        BarLoopTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BarLoopTests
